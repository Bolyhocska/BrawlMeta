name: News — Digest (Mon/Wed/Fri)

# Publishes our OWN measured data to /news on a fixed 3x/week beat, so the page
# has a steady cadence instead of only spiking right after a patch (patches
# land roughly every 2-3 weeks; the owner wants content 3 days a week
# regardless). Writes news_posts DIRECTLY — no review step, unlike
# news-watch.yml — because this content is our own numbers, the same trust
# level as the tier list, never a websearch result. See scrapers/news_digest.py
# for the two content types and why most Mon/Wed/Fri runs will still publish
# nothing when neither clears its significance bar (rare, but expected).
#
# 09:45 UTC, Mon/Wed/Fri: after news-watch (09:15) so the two never race on the
# same news_posts table, and clear of every scraper slot.
on:
  schedule:
    - cron: '45 9 * * 1,3,5'
  workflow_dispatch:

concurrency:
  group: news-digest
  cancel-in-progress: false

jobs:
  news-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate today's digest (if there's something real to say)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Unused by this script — it never touches the Supercell API — but
          # common.require_credentials() checks all three unconditionally
          # (same reason check-map-pool.yml sets it despite not needing it).
          SUPERCELL_API_KEY: ${{ secrets.SUPERCELL_API_KEY }}
        run: python -m scrapers.news_digest
