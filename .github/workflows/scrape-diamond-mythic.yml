name: Scrape — Diamond/Mythic Matches

# Diamond/Mythic ranked-match spider. Daily, offset from the Masters run so
# the two spiders never share the proxy/API budget at the same time. Exits
# early on its own if the Masters 400k baseline isn't met yet.
# PAUSED 2026-09-19 (owner decision). The schedule is commented out rather than
# the file deleted, and workflow_dispatch is deliberately kept so the bracket
# can be smoke-tested before it is turned back on. To resume: uncomment the
# two schedule lines AND flip DIAMOND_ENABLED to true in src/appCore.js — the
# collector refilling a bracket the UI still hides would be pure cost.
#
# Reason: the free Supabase tier is 500 MB and this bracket costs ~66 MB across
# ranked_matches plus every per-bracket aggregate. Nothing needs restoring by
# hand when it comes back; the spider rebuilds the bracket from scratch.
on:
  # schedule:
  #   - cron: '30 7 * * *'
  workflow_dispatch:


# One run at a time. Every scraper shares a single IP-allowlisted Supercell
# key, so an overrunning run and its successor do not merely duplicate work -
# they compete for the same rate budget. Queue rather than cancel, so a run
# that is nearly finished is allowed to push what it collected.
concurrency:
  group: scrape-diamond-mythic
  cancel-in-progress: false

jobs:
  diamond-mythic:
    runs-on: ubuntu-latest
    # daily
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Diamond/Mythic scraper
        env:
          SUPERCELL_API_KEY: ${{ secrets.SUPERCELL_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PROXY_HOST: ${{ secrets.PROXY_HOST }}
          PROXY_PORT: ${{ secrets.PROXY_PORT }}
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}
        run: python -m scrapers.diamond_mythic
