name: News — Daily Watch

# Checks once a day for genuinely new Brawl Stars news (balance patches,
# brawler reveals, Brawl Talk) via the Claude API's server-side web search, and
# separately checks whether a human approved yesterday's finding.
#
# MOST RUNS DO NOTHING VISIBLE and that is the expected, correct outcome — real
# news here comes roughly every two weeks. Nothing this job finds reaches the
# public site directly: a candidate opens a GitHub issue and only publishes to
# news_posts once a human adds the `approved` label. See scrapers/news_watch.py
# for why (unattended search + summarization can fabricate a plausible-sounding
# item when a search comes back thin, which is not acceptable on a page
# visitors read as fact).
#
# 09:15 UTC: clear of every scraper slot (00/06/12/18 masters, 05/11/17/23
# leaderboard, 07:30 diamond, 08:30 intelligence, 02:20/10:20/14:20/20:20
# tracker, 04:40 map-pool). Touches no Supercell API budget at all — this only
# calls the Anthropic and GitHub APIs.
# PAUSED 2026-09-19. The Anthropic account has no credit balance, so every run
# fails with 400 'Your credit balance is too low' — verified from the API's own
# response body, not inferred. A workflow that is red every single day trains
# you to ignore red, which is how a real failure gets missed.
#
# TO RESUME: add credits at console.anthropic.com (Plans & Billing), then
# uncomment the two schedule lines. Run it once via workflow_dispatch first to
# confirm before putting it back on a timer. The GitHub secret itself is
# already correct — a wrong key returns 401, and this returns 400.
on:
  # schedule:
  #   - cron: '15 9 * * *'
  workflow_dispatch:

concurrency:
  group: news-watch
  cancel-in-progress: false

permissions:
  # Needed to open/comment/close the review issue and read its labels.
  # Nothing else in this repo grants issues:write, so it is scoped narrowly to
  # this one job rather than raised at the repo level.
  issues: write
  contents: read

jobs:
  news-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check for approvals, then search for news
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Unused by this script — it never touches the Supercell API — but
          # common.require_credentials() checks all three unconditionally
          # (same reason check-map-pool.yml sets it despite not needing it).
          SUPERCELL_API_KEY: ${{ secrets.SUPERCELL_API_KEY }}
          # GITHUB_TOKEN and GITHUB_REPOSITORY are provided automatically by
          # Actions for every job — nothing to add in repo secrets for these.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scrapers.news_watch
